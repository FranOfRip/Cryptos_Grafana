groups:
  - name: crypto_pipeline_alerts
    rules:

      # Alerta 1: Lag del producer — si deja de recibir mensajes de Binance
      - alert: ProducerSinMensajes
        expr: rate(binance_mensajes_total[2m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "El producer no recibe mensajes de Binance"
          description: "No se han recibido mensajes de Binance en los últimos 2 minutos. Posible caída del WebSocket."

      # Alerta 2: Pump & Dump detectado
      - alert: PumpDumpDetectado
        expr: increase(spark_pump_dump_detectados_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Pump & Dump detectado en {{ $labels.par }}"
          description: "Se ha detectado una variación >2% en una ventana de 5 minutos para el par {{ $labels.par }}."

      # Alerta 3: Contenedor con memoria alta
      - alert: ContenedorMemoriaAlta
        expr: container_memory_usage_bytes > 500000000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Memoria alta en contenedor {{ $labels.name }}"
          description: "El contenedor {{ $labels.name }} lleva 3 minutos usando más de 500 MB de memoria."
