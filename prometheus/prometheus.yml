global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "producer"
    static_configs:
      - targets: ["crypto-exchange-producer-1:8000"]

  - job_name: "spark"
    static_configs:
      - targets: ["crypto-exchange-spark-1:8001"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["crypto-exchange-node-exporter-1:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["crypto-exchange-cadvisor-1:8080"]
